apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mqtt-mcp.fullname" . }}
  labels:
    {{- include "mqtt-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mqtt-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "mqtt-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.image.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.imagePullSecretName }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mqtt-mcp.fullname" . }}
            - secretRef:
                name: {{ include "mqtt-mcp.fullname" . }}
