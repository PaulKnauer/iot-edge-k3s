apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mqtt-mcp.fullname" . }}
  labels:
    {{- include "mqtt-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MQTT_MCP_BROKER_PASSWORD: {{ .Values.secret.brokerPassword | default "" | quote }}
  {{- if .Values.secret.authToken }}
  MQTT_MCP_AUTH_TOKEN: {{ .Values.secret.authToken | quote }}
  {{- end }}
  {{- if .Values.secret.authCredentials }}
  MQTT_MCP_AUTH_CREDENTIALS: {{ .Values.secret.authCredentials | quote }}
  {{- end }}
  {{- if .Values.secret.restAuthToken }}
  MQTT_MCP_REST_AUTH_TOKEN: {{ .Values.secret.restAuthToken | quote }}
  {{- end }}
